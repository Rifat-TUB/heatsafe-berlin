<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeatSafe Berlin</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 12px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
        }
        header p {
            margin: 4px 0 0;
            font-size: 13px;
        }
        #map {
            height: calc(100vh - 70px);
            width: 100%;
        }
        #toast {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.4;
            max-width: 340px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>HeatSafe Berlin</h1>
        <p>Heat risk and cooling places around Alexanderplatz</p>
    </header>

    <div id="map"></div>
    <div id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const API = "http://localhost:8000";

// ---- Small message shown on top of the map (replaces alert) ----
function showMessage(text, ms) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(function () {
        t.style.display = 'none';
    }, ms || 5000);
}

const map = L.map('map').setView([52.5219, 13.4132], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const riskColor = {
    high: '#d73027',
    medium: '#fc8d59',
    low: '#91cf60'
};

// ---- Heat zones ----
fetch(API + '/api/heat-zones')
    .then(res => res.json())
    .then(data => {
        L.geoJSON(data, {
            style: feature => ({
                color: riskColor[feature.properties.risk_level],
                weight: 2,
                fillOpacity: 0.35
            }),
            onEachFeature: (feature, layer) => {
                const p = feature.properties;
                layer.bindPopup(
                    '<b>' + p.name + '</b><br>' +
                    'Risk level: ' + p.risk_level + '<br>' +
                    'Heat indicator: ' + p.temp_indicator + ' &deg;C<br>' +
                    'Surface: ' + p.surface_type + '<br>' +
                    '<i>Source: ' + p.data_source + ' data</i>'
                );
            }
        }).addTo(map);
    })
    .catch(err => console.error('Heat zones failed:', err));


// ---- Cooling places (reloadable) ----
let coolingLayer = null;

function loadCoolingPlaces() {
    fetch(API + '/api/cooling-places')
        .then(res => res.json())
        .then(data => {
            if (coolingLayer) map.removeLayer(coolingLayer);
            coolingLayer = L.geoJSON(data, {
                pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
                    radius: 7,
                    color: '#1a5490',
                    fillColor: '#4a9fd8',
                    fillOpacity: 0.9,
                    weight: 2
                }),
                onEachFeature: (feature, layer) => {
                    const p = feature.properties;
                    layer.bindPopup(
                        '<b>' + p.name + '</b><br>' +
                        'Type: ' + p.place_type + '<br>' +
                        (p.description || '')
                    );
                }
            }).addTo(map);
        })
        .catch(err => console.error('Cooling places failed:', err));
}

loadCoolingPlaces();

// ---- Shared: show the nearest cooling place from a point ----
let resultLayer = null;

function showNearest(lat, lon, label) {
    if (resultLayer) map.removeLayer(resultLayer);
    resultLayer = L.layerGroup().addTo(map);

    fetch(API + '/api/cooling-places/nearest?lat=' + lat + '&lon=' + lon)
        .then(res => res.json())
        .then(data => {
            const best = data.results[0];
            if (!best) return;

            L.marker([lat, lon]).addTo(resultLayer).bindPopup(label);

            L.circleMarker([best.lat, best.lon], {
                radius: 11,
                color: '#0b6623',
                fillColor: '#7ed957',
                fillOpacity: 1,
                weight: 3
            }).addTo(resultLayer)
              .bindPopup(
                  '<b>' + best.name + '</b><br>' +
                  'Type: ' + best.place_type + '<br>' +
                  '<b>Distance: ' + best.distance_m + ' m</b><br>' +
                  '<i>Calculated by PostGIS</i>'
              ).openPopup();

            L.polyline([[lat, lon], [best.lat, best.lon]], {
                color: '#0b6623',
                weight: 3,
                dashArray: '6 6'
            }).addTo(resultLayer);

            map.fitBounds(
                [[lat, lon], [best.lat, best.lon]],
                { padding: [70, 70], maxZoom: 16 }
            );
        })
        .catch(err => console.error('Nearest failed:', err));
}

// ---- Mode handling: only one map-click job at a time ----
let mode = null;
let pending = null;
let gpsBusy = false;

function setMode(newMode) {
    mode = newMode;
    document.getElementById('findBtn').textContent =
        mode === 'find' ? 'Click the map...' : 'Find nearest';
    document.getElementById('addBtn').textContent =
        mode === 'add' ? 'Click the map...' : 'Add place';
    map.getContainer().style.cursor = mode ? 'crosshair' : '';
}

// ---- Buttons ----
function makeButton(id, label, title) {
    const c = L.control({ position: 'topright' });
    c.onAdd = function () {
        const div = L.DomUtil.create('div', 'leaflet-bar');
        div.innerHTML =
            '<a href="#" id="' + id + '" title="' + title + '" ' +
            'style="width:auto;padding:0 10px;font-weight:bold;">' + label + '</a>';
        L.DomEvent.disableClickPropagation(div);
        return div;
    };
    c.addTo(map);
}

makeButton('findBtn', 'Find nearest', 'Find nearest cooling place');
makeButton('addBtn', 'Add place', 'Add a new cooling place');
makeButton('gpsBtn', 'Where am I', 'Use my current location');

// ---- The add form, shown as a map popup ----
function openAddForm(lat, lon) {
    const html =
        '<div style="min-width:210px">' +
        '<b>Add a cooling place</b><br>' +
        '<small>' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</small><br><br>' +
        '<input id="npName" placeholder="Name" style="width:100%;margin-bottom:6px">' +
        '<select id="npType" style="width:100%;margin-bottom:6px">' +
        '<option value="fountain">fountain</option>' +
        '<option value="park">park</option>' +
        '<option value="shade">shade</option>' +
        '<option value="indoor">indoor</option>' +
        '<option value="water">water</option>' +
        '</select>' +
        '<input id="npDesc" placeholder="Description (optional)" style="width:100%;margin-bottom:8px">' +
        '<button id="npSave" style="width:100%;padding:5px">Save</button>' +
        '<div id="npMsg" style="color:#c0392b;margin-top:6px;font-size:12px"></div>' +
        '</div>';

    L.popup().setLatLng([lat, lon]).setContent(html).openOn(map);
}

function readError(body) {
    if (body && Array.isArray(body.detail) && body.detail.length) {
        return body.detail[0].msg || 'Invalid input.';
    }
    return 'Could not save.';
}

// ---- All button clicks ----
document.addEventListener('click', function (e) {

    if (e.target.id === 'findBtn') {
        e.preventDefault();
        setMode(mode === 'find' ? null : 'find');
        return;
    }

    if (e.target.id === 'addBtn') {
        e.preventDefault();
        setMode(mode === 'add' ? null : 'add');
        return;
    }
    if (e.target.id === 'gpsBtn') {
        e.preventDefault();
        setMode(null);

        // Ignore a second click while a request is still running
        if (gpsBusy) return;
                document.getElementById('toast').style.display = 'none';

        if (!navigator.geolocation) {
            showMessage('This browser does not support geolocation.');
            return;
        }

        const target = e.target;
        gpsBusy = true;
        target.textContent = 'Locating...';

        navigator.geolocation.getCurrentPosition(
            function (pos) {
                gpsBusy = false;
                target.textContent = 'Where am I';
                showNearest(pos.coords.latitude, pos.coords.longitude,
                            'You are here (GPS)');
            },
            function (err) {
                gpsBusy = false;
                target.textContent = 'Where am I';
                let why;
                if (err.code === 1) {
                    why = 'Permission was refused. Click the location icon in the address bar, choose Allow, then reload the page.';
                } else if (err.code === 2) {
                    why = 'Position unavailable. Check that location is switched on in Windows settings.';
                } else if (err.code === 3) {
                    why = 'It took too long. Please try again.';
                } else {
                    why = err.message;
                }
                showMessage('Could not get your location. ' + why, 8000);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
        return;
    }

    if (e.target.id === 'npSave') {

        e.preventDefault();
        const msg = document.getElementById('npMsg');
        const name = document.getElementById('npName').value.trim();

        if (!name) {
            msg.textContent = 'Name is required.';
            return;
        }

        e.target.textContent = 'Saving...';
        msg.textContent = '';

        fetch(API + '/api/cooling-places', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                place_type: document.getElementById('npType').value,
                description: document.getElementById('npDesc').value.trim() || null,
                lat: pending.lat,
                lon: pending.lon
            })
        })
        .then(res => res.json().then(body => {
            if (res.status !== 201) throw new Error(readError(body));
            return body;
        }))
        .then(() => {
            map.closePopup();
            loadCoolingPlaces();
        })
        .catch(err => {
            msg.textContent = err.message;
            const b = document.getElementById('npSave');
            if (b) b.textContent = 'Save';
        });
    }
});

// ---- Map clicks ----
map.on('click', function (e) {
    if (!mode) return;

    const lat = e.latlng.lat;
    const lon = e.latlng.lng;

    if (mode === 'find') {
        showNearest(lat, lon, 'Your location');
    } else if (mode === 'add') {
        pending = { lat: lat, lon: lon };
        openAddForm(lat, lon);
    }

    setMode(null);
});
    </script>
</body>
</html>
